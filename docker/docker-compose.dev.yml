services:
  # Whatomate app (Development with hot reloading)
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: whatomate_app_dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - whatomate
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount source code for hot reloading
      - ..:/app:rw
      - /app/tmp  # Exclude tmp directory from sync
      - ../config.toml:/app/config.toml:ro
    environment:
      - CGO_ENABLED=0
      - GOOS=linux

  # Frontend (Development with Vite hot reloading)
  frontend:
    image: node:20-alpine
    container_name: whatomate_frontend_dev
    working_dir: /app
    ports:
      - "5173:5173"
    networks:
      - whatomate
    volumes:
      - ../frontend:/app:rw
      - /app/node_modules  # Use container's node_modules
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://localhost:8080

  # PostgreSQL database
  db:
    image: postgres:17-alpine
    container_name: whatomate_db_dev
    restart: unless-stopped
    networks:
      - whatomate
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatomate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatomate}
      POSTGRES_DB: ${POSTGRES_DB:-whatomate}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatomate} -d ${POSTGRES_DB:-whatomate}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data

  # Redis
  redis:
    image: redis:7-alpine
    container_name: whatomate_redis_dev
    restart: unless-stopped
    networks:
      - whatomate
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data-dev:/data

networks:
  whatomate:

volumes:
  postgres-data-dev:
  redis-data-dev:
